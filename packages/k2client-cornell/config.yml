Id:             'k2client-cornell'
Description:    'k2client-cornell 2026b2'
Version:        '8.0.1.2'

Install:
  - File:       '%INSTALL_DIR%\ksp-client-x64.exe'
    FileType:   'exe'
    Arguments:  '-q -upg -v PROP_HOSTNAME=%HOSTNAME% -v PROP_SITE=%AppStream_Resource_Name% -v PROP_FORCEHOST=1 -v PROP_LOCKED=1 -v PROP_SHORTCUTS=0 -v ARPSYSTEMCOMPONENT=1" -Wait'
    ExitCodes:  [0]

Scripts:                                                ## AppStream session scripts feature
    start:                                              ## Startup / Logon trigger
        User:    '%TOOLS_DIR%\startup.ps1'   

#can supposedly set machine name at HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\KeyAccess\Settings\logon\machine
#
#preinstall defines 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' -Name "AoD_Combo" -Value '%AppStream_UserName%.%AppStream_Resource_Name%'
#
#postinstall: New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\KeyAccess\Settings\logon' -Name 'user' -Value '%AppStream_UserName%.%AppStream_Resource_Name%' -PropertyType ExpandString -Force
#This always seems to be user=PhotnUser to the keyserver
#seems like this can hold host=<keyserver host>
#machine=machine name
