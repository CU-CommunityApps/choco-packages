        WorkDir:        ''
        
    kaledoweave:
        DisplayName:    'Kaledo Weave'
        Path:           '%PROGRAMFILES(X86)%\Lectra\KaledoWeave\KaledoWeave.exe'
        LaunchParams:   ''
        WorkDir:        ''
        
    kaledostyle:
        DisplayName:    'Kaledo Style'
        Path:           '%PROGRAMFILES(X86)%\Lectra\Kaledo Style\bin\KaledoStyle.exe'
        LaunchParams:   ''
        WorkDir:        ''





