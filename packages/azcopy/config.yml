Id:             'azcopy'                ## Application package name ie. chrome-cornell
Description:    'azcopy test 3'    ## Application packages description
Version:        '1.0.0'                     ## Application version number - MUST BE in #.# format

Install:                                    ## If there are installation files in a .zip to be installed, specify here
  - File:       '%TOOLS_DIR%\CHE-Kaledo\Invoke-AppDeployToolkit.exe'   ## Installation file
    FileType:   'exe'                       ## exe or msi are the only options currently
    Arguments:  '-DeployMode Silent'        ## Silent installation switches/parmeters
    ExitCodes:  [0] 

Applications:
