Id:             'rstudio-cornell'
Description:    'RStudio b20261115.6'
Version:        '2026.11.0'
    
Install:
  - File:       '%TOOLS_DIR%\RStudio-latest.exe'   ## downloaded by preinstall.ps1
    FileType:   'exe'
    Arguments:  '/S'
    ExitCodes:  [0]
    
Applications:
    rstudio:
        DisplayName:    'RStudio'
        Path:           '%PROGRAMFILES%\RStudio\rstudio.exe'
        LaunchParams:   ''
        WorkDir:        ''

Files: 
    '%TOOLS_DIR%\crash-handler-permission': '%SYSTEMDRIVE%\Users\Default\AppData\Local\RStudio\crash-handler-permission'
    '%INSTALL_DIR%\RStudio': '%SYSTEMDRIVE%\Users\Default\AppData\Roaming\RStudio'
